[project]
name = "qualume"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dylan Gagliordi", email = "dylangagliordi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "crawl4ai>=0.7.0",
    "google-genai>=2.31.0",
    "langchain-anthropic>=1.7.5",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.14",
    "pandas>=3.1.1",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "voyageai>=0.5.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
qualume = "qualume:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
