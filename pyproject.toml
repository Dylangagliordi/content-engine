[project]
name = "qualume"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Dylan Gagliordi", email = "dylangagliordi@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.31.0",
    "langchain-anthropic>=1.7.5",
    "langgraph>=1.2.14",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
qualume = "qualume:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
